name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-deploy.yml"
      - "supabase/migrations/**"
      - "supabase/functions/**"
  workflow_dispatch: {}

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: uqinpckirpatvkxyizqf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Repair pre-existing migration history
        # These versions' objects already exist live (applied out of band
        # before this workflow existed, or before it could reach a working
        # state) but aren't recorded in Supabase's migration tracking table,
        # which makes `db push` try to re-apply them and fail on duplicate
        # objects. This marks them applied without re-running their SQL.
        # Safe to run on every deploy: repairing an already-applied version
        # is a no-op.
        run: |
          supabase migration repair --remote="$SUPABASE_PROJECT_ID" --yes --status applied 20260424250000
          supabase migration repair --remote="$SUPABASE_PROJECT_ID" --yes --status applied 20260426000000
          # 20261118: six migrations were applied out of band under different
          # versions than their files. Drop those history rows and record the
          # matching files as applied instead (real_route_stops,
          # delete_cancelled_shipment, shipment_excursion_push,
          # shipment_assignment_push, merchant_consignments_p0,
          # consignment_loss_policy). 20261118160000 merchant_consignments was
          # never applied and is superseded by the p0 migration; running it now
          # would replace the newer consignment RPCs with older ones.
          supabase migration repair --remote="$SUPABASE_PROJECT_ID" --yes --status reverted 20261118093343 20261118094622 20261118110017 20261118120228 20261118152238 20261118160243
          supabase migration repair --remote="$SUPABASE_PROJECT_ID" --yes --status applied 20261118123500 20261118130000 20261118140000 20261118153000 20261118160000 20261118170000 20261118190000

      - name: Push database migrations
        run: supabase db push --remote="$SUPABASE_PROJECT_ID" --yes

      - name: Deploy edge functions
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_ID" --yes
