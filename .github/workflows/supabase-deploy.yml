name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
  workflow_dispatch: {}

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: uqinpckirpatvkxyizqf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Repair pre-existing migration history
        # 20260424250000_vault_backups_admin_access.sql's objects already
        # exist live (applied out of band before this workflow existed) but
        # aren't recorded in Supabase's migration tracking table, which
        # makes `db push` try to re-apply it and fail on a duplicate policy.
        # This marks it applied without re-running its SQL. Safe to run on
        # every deploy: repairing an already-applied version is a no-op.
        run: supabase migration repair --status applied 20260424250000

      - name: Push database migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
