# call-session does its own JWT verification (with a fallback decode path)
# so we skip the gateway-level verify to avoid brittle JWT_SECRET coupling.
[functions.call-session]
verify_jwt = false

[functions.p2p-scraper]
verify_jwt = false

[functions.push-send]
verify_jwt = false

# Public, token-authenticated statement page — no Supabase session exists
# when this is called, so gateway JWT verification must stay off.
[functions.public-buyer-statement]
verify_jwt = false
